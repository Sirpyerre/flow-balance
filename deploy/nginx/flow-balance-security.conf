# Cabeceras de seguridad de Flow Balance. Se instala en /etc/nginx/snippets/flow-balance-security.conf.
# Nginx no hereda add_header en un bloque que define el suyo, así que el vhost incluye este archivo en cada location.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
