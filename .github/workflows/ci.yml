name: CI

# Pruebas en cada push y pull request. También las reutiliza deploy.yml: un despliegue no sale sin que estas pasen.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} + MariaDB 10.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '33069'
      DB_DATABASE: flow_balance
      DB_USERNAME: flow_balance_app
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '33069'
      TEST_DB_DATABASE: flow_balance_test
      TEST_DB_USERNAME: flow_balance_test_app
      MIGRATION_TEST_DB_HOST: 127.0.0.1
      MIGRATION_TEST_DB_PORT: '33069'
      MIGRATION_TEST_DB_DATABASE: flow_balance_migration_test
      MIGRATION_TEST_DB_USERNAME: flow_balance_migration_test_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, ctype
          tools: composer:v2
          coverage: none

      - name: Dependencias de PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: composer.json válido y requisitos de plataforma del lock
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs

      # Contraseñas aleatorias de este trabajo: ningún secreto del repositorio interviene en las pruebas.
      - name: Contraseñas de prueba
        run: |
          for name in MARIADB_ROOT_PASSWORD DB_PASSWORD TEST_DB_PASSWORD MIGRATION_TEST_DB_PASSWORD TEST_APP_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # El mismo MariaDB 10.11, con la misma colación y el mismo script de arranque que el desarrollo local.
      - name: MariaDB 10.11 (compose.yaml)
        run: docker compose up -d --build --wait mariadb

      # MariaDB arranca vacía: las pruebas de integración usan flow_balance_test, que en local ya está migrada.
      # (flow_balance_migration_test se deja vacía a propósito: sus pruebas la migran por su cuenta.)
      - name: Migrar la base de pruebas
        run: composer db:migrate

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Registro de MariaDB si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 80 mariadb

      - name: Apagar MariaDB
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Compilar el sitio estático
        env:
          APP_ORIGIN: https://flow-balance.test
        run: |
          npm run build
          test -f dist/index.html
