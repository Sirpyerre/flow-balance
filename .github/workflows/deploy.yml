name: Deploy

# Producción solo desde main o por acción manual, y solo si las pruebas pasan. El trabajo "deploy" corre bajo el entorno
# "production" (revisores requeridos y limitado a la rama main en Settings > Environments); lo único sensible que toca
# GitHub es la llave SSH de despliegue. Los secretos de la aplicación (APP_SECRET, DB_PASSWORD) viven solo en el
# servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Construir el paquete
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, ctype
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Todo se construye aquí: el servidor no ejecuta Composer, Node ni compilaciones.
      - name: Dependencias de producción de PHP
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction

      - name: Frontend con el origen público
        working-directory: frontend
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          test -n "$APP_ORIGIN" || { echo "::error::falta la variable APP_ORIGIN del repositorio (Settings > Secrets and variables > Actions > Variables); el job build no usa el entorno production"; exit 1; }
          npm ci
          npm run build

      # Lista blanca; falla si aparece alguna ruta prohibida. Se lista el contenido antes de subirlo.
      - name: Armar el paquete
        run: |
          deploy/package.sh build/package
          tar -czf flow-balance.tar.gz -C build/package .
          echo "Primer nivel del paquete:"; ls -A build/package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-balance-package
          path: flow-balance.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Desplegar a producción
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    steps:
      # Solo se necesitan los scripts de despliegue, no el árbol completo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-balance-package

      - name: Desplegar
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS APP_ORIGIN DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] || { echo "::error::falta ${name} en el entorno production"; exit 1; }
          done
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          export DEPLOY_SSH_KEY_FILE="$key_file"

          mkdir package && tar -xzf flow-balance.tar.gz -C package
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          app_host="${APP_ORIGIN#https://}"
          deploy/push.sh package "$release" "$app_host"
