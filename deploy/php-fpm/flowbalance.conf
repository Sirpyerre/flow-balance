; Pool de Flow Balance. Se instala en /etc/php/8.3/fpm/pool.d/flowbalance.conf.
; Comparte el proceso maestro de PHP-FPM con el blog, pero tiene su propio usuario, su propio socket y límites
; bastante menores que los del pool "www" (5 hijos de 128 MB): el servidor tiene 961 MB y ya usa swap.
[flowbalance]
user = flowbalance
group = flowbalance

listen = /run/php/flowbalance.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 500

request_terminate_timeout = 30s
catch_workers_output = yes
security.limit_extensions = .php

; La configuración y los secretos salen de /var/www/flowbalance/shared/.env (modo 600, dueño flowbalance), que
; Dotenv lee desde el release; no se inyectan aquí.
clear_env = yes

php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[date.timezone] = UTC
php_admin_value[open_basedir] = /var/www/flowbalance:/tmp
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
